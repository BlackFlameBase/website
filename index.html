<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ece5dc" />
  <meta name="description" content="Black Flame — a living system for creators." />
  <title>Black Flame</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="siteHeader">
    <a class="brand" href="index.html" aria-label="Black Flame home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span data-content="brand.name">BLACK FLAME</span>
    </a>

    <nav class="primary-nav" aria-label="Primary navigation" id="primaryNav"></nav>

    <div class="header-tools">
      <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false">
        <span>SOUND</span><span class="sound-wave" aria-hidden="true">┼ ┼</span>
      </button>
      <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="mobileNav">MENU</button>
    </div>
  </header>
  <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"></nav>

  <main id="main">
    <section class="hero" aria-labelledby="heroTitle">
      <div class="hero-grid-lines" aria-hidden="true"></div>

      <div class="hero-copy">
        <p class="eyebrow" data-content="hero.eyebrow"></p>
        <h1 id="heroTitle" data-content="hero.title"></h1>
        <p class="hero-core" data-content="hero.core"></p>
        <p class="hero-orientation" data-content="hero.orientation"></p>
        <div class="hero-actions">
          <a class="button button-outline" data-link="hero.primary"></a>
          <button class="text-button" id="heroSoundButton" type="button" data-content="hero.soundPrompt"></button>
        </div>
      </div>

      <div class="hero-stage" aria-label="Living Black Flame in a luminous institutional chamber">
        <div class="architecture" aria-hidden="true">
          <span class="column c1"></span><span class="column c2"></span><span class="column c3"></span>
          <span class="column c4"></span><span class="column c5"></span><span class="column c6"></span>
          <span class="floor-line f1"></span><span class="floor-line f2"></span><span class="floor-line f3"></span>
        </div>
        <div class="halo" aria-hidden="true"></div>
        <img class="living-flame" id="livingFlame" src="assets/images/living-black-flame.png" alt="Abstract living black flame" />
      </div>

      <aside class="system-panel" aria-label="Creator System signal panel">
        <p class="panel-heading" data-content="hero.system.heading"></p>
        <div class="system-stages" id="systemStages"></div>
        <div class="geometry-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100"><polygon points="50,7 86,28 86,70 50,92 14,70 14,28"/><path d="M50 7v85M14 28l72 42M86 28L14 70M14 28h72M14 70h72"/><circle cx="50" cy="50" r="4"/></svg>
        </div>
        <p class="concept"><strong data-content="hero.system.concept"></strong><span data-content="hero.system.conceptSub"></span></p>
        <span class="mini-rule" aria-hidden="true"></span>
        <div class="system-statements" id="systemStatements"></div>
        <div class="instrument" aria-hidden="true"><span></span><i></i><i></i><i class="active"></i><i></i><i></i><i></i></div>
      </aside>
    </section>

    <nav class="gateway-strip" id="gatewayStrip" aria-label="Explore the Black Flame site through Home"></nav>

    <div id="teaserSections"></div>

    <section class="subscriber-layer" id="subscribe" aria-labelledby="subscribeTitle">
      <div class="subscriber-sigil" aria-hidden="true">✦</div>
      <div class="subscriber-intro">
        <p class="eyebrow" data-content="subscriber.eyebrow"></p>
        <h2 id="subscribeTitle" data-content="subscriber.title"></h2>
        <p data-content="subscriber.body"></p>
        <p class="primer-note"><strong data-content="subscriber.primerTitle"></strong> <span data-content="subscriber.primerBody"></span></p>
      </div>
      <form class="subscribe-form" id="subscribeForm">
        <label class="sr-only" for="subscriberEmail">Email address</label>
        <input id="subscriberEmail" name="email" type="email" autocomplete="email" placeholder="ENTER EMAIL ADDRESS" required />
        <button class="button button-dark" type="submit" data-content="subscriber.cta"></button>
      </form>
      <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="living-layer" aria-labelledby="livingLayerTitle">
      <div>
        <p class="eyebrow" data-content="livingLayer.eyebrow"></p>
        <h2 id="livingLayerTitle" data-content="livingLayer.title"></h2>
      </div>
      <nav class="social-icons" id="socialIcons" aria-label="Black Flame external channels"></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-brand"><span class="brand-mark" aria-hidden="true"></span><span data-content="brand.name"></span></div>
    <p data-content="footer.statement"></p>
    <p data-content="footer.copyright"></p>
    <nav id="footerLinks" aria-label="Footer"></nav>
  </footer>

  <audio id="siteAudio" loop preload="none">
    <source src="assets/audio/black-flame.mp3" type="audio/mpeg" />
  </audio>

  <script src="content.js"></script>
  <script src="site.js"></script>
</body>
</html>
